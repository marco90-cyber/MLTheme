name: Build MLTheme

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Libreria + app di prova
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :mltheme:assembleRelease :sample:assembleDebug :mltheme:publishReleasePublicationToMavenLocal --no-daemon 2>&1 | tee build.log
      - name: Mostra errori
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Prova con un'app su Kotlin 1.9 (come MLSkywatch, WLandroid, Magic touch remove)
        run: |
          set -e
          mkdir -p /tmp/compat/app/src/main/java/t && cd /tmp/compat
          cp -r $GITHUB_WORKSPACE/gradle $GITHUB_WORKSPACE/gradlew $GITHUB_WORKSPACE/gradle.properties .
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { mavenLocal(); google(); mavenCentral() } }
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "t"; compileSdk = 34
              defaultConfig { minSdk = 26 }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("com.github.marco90-cyber:MLTheme:dev")
              implementation("androidx.activity:activity-compose:1.9.2")
          }
          EOF
          echo '<manifest/>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/t/T.kt <<'EOF'
          package t
          import androidx.compose.runtime.Composable
          import com.marco.mltheme.*
          @Composable fun T() = MLTheme { MLSettingsScaffold("x", null) { MLThemeSettingsGroup(); MLGroup("y") { MLSwitchRow("a", null, true) {} } } }
          EOF
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MLTheme-demo
          path: sample/build/outputs/apk/debug/sample-debug.apk

  jitpack:
    # su ogni nuova versione (tag) chiede a JitPack di prepararla e ne mostra il risultato
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepara la versione su JitPack
        run: |
          T=${GITHUB_REF_NAME}
          U=https://jitpack.io/com/github/marco90-cyber/MLTheme/$T
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 300 "$U/MLTheme-$T.pom" || echo 000)
            echo "tentativo $i: $code"
            [ "$code" = "200" ] && break
            sleep 30
          done
          curl -s "$U/build.log" | tail -40
          [ "$code" = "200" ] || { echo "::error::JitPack non ha pubblicato $T"; exit 1; }
          echo "::notice::Pronto: implementation(\"com.github.marco90-cyber:MLTheme:$T\")"
